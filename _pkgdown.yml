url: https://charbase.github.io/charport/

template:
  bootstrap: 5
  light-switch: true
  bslib:
    font-size-base: "0.9rem"

# The funder holds the fnd role, which pkgdown would otherwise print in the
# "Developed by" footer alongside the author. The authors page credits both.
authors:
  footer:
    roles: [aut, cre]

navbar:
  structure:
    left: [developer_guide, error_handling, design_rationale, reference]
    right: [search, github, lightswitch]
  components:
    developer_guide:
      text: "Developer guide"
      href: articles/developer-guide.html
    error_handling:
      text: "Error handling"
      href: articles/error-handling.html
    design_rationale:
      text: "Design rationale"
      href: articles/design-rationale.html

articles:
- title: Start Here
  navbar: ~
  contents:
  - charport
- title: Developer Documentation
  contents:
  - developer-guide
  - error-handling
  - design-rationale

reference:
- title: Construct And Inspect `charvec`
  contents:
  - charvec
  - is_charvec
  - as_charvec
  - charport_materialize
- title: Class Diagnostics
  contents:
  - charport_classes
  - charport_info
  - charport_class_of
