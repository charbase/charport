name: ASan with LTO

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Reproduce the original failure or verify the selected revision
        required: true
        default: verify
        type: choice
        options:
          - verify
          - reproduce

permissions:
  contents: read

jobs:
  asan-lto:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - name: Check out the test driver
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Keep the current test driver even when testing the historical source.
      - name: Check out the source under test
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.mode == 'reproduce' && 'b407c00646a3d9ca20410578d7b1243783fd2dc4' || github.sha }}
          path: subject

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: devel
          use-public-rspm: true

      - name: Install wrapper test dependencies
        shell: Rscript {0}
        run: |
          install.packages(c("Rcpp", "cpp11"))
          stopifnot(packageVersion("cpp11") >= "0.5.2")

      - name: Compare ASan without and with LTO
        id: test
        env:
          TEST_MODE: ${{ inputs.mode }}
        run: bash tools/reproduce-asan-odr.sh package "$TEST_MODE" "$GITHUB_WORKSPACE/subject"

      - name: Upload compiler configuration and test logs
        if: ${{ always() && steps.test.outputs.results != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: asan-lto-${{ inputs.mode }}-${{ github.run_attempt }}
          path: |
            ${{ steps.test.outputs.results }}/*.log
            ${{ steps.test.outputs.results }}/*.txt
            ${{ steps.test.outputs.results }}/*.status
            ${{ steps.test.outputs.results }}/*.Makevars
          if-no-files-found: error
          retention-days: 14
