<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 392" role="img" aria-labelledby="title desc">
  <title id="title">ALTREP string access</title>
  <desc id="desc">A two-column flowchart comparing Base R access, which materializes strings before creating string views, with charport access, which skips materialization and reads string byte views.</desc>
  <defs>
    <style>
      .background { fill: #1f2529; }
      .title {
        fill: #f2ead9;
        font: 700 28px Inter, Avenir, Helvetica, Arial, sans-serif;
      }
      .column {
        fill: #f2ead9;
        font: 700 19px Inter, Avenir, Helvetica, Arial, sans-serif;
      }
      .text {
        fill: #f2ead9;
        font: 600 17px Inter, Avenir, Helvetica, Arial, sans-serif;
      }
      .muted {
        fill: #c7d0cc;
        font: 600 15px Inter, Avenir, Helvetica, Arial, sans-serif;
      }
      .box {
        fill: none;
        stroke: #9aa7a8;
        stroke-width: 1.5;
      }
      .skip {
        fill: none;
        stroke: #9aa7a8;
        stroke-width: 1.5;
        stroke-dasharray: 5 6;
      }
      .rule {
        stroke: #59666a;
        stroke-width: 1.2;
      }
      .arrow {
        fill: none;
        stroke: #9aa7a8;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        marker-end: url(#arrowhead);
      }
    </style>
    <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#9aa7a8"/>
    </marker>
  </defs>

  <rect width="1040" height="392" class="background"/>
  <g transform="translate(0 -16)">
  <line x1="520" y1="38" x2="520" y2="350" class="rule"/>

  <text x="260" y="56" text-anchor="middle" class="column">Base R</text>
  <text x="780" y="56" text-anchor="middle" class="column">charport</text>

  <rect x="80" y="80" width="360" height="48" rx="2" class="box"/>
  <text x="260" y="110" text-anchor="middle" class="text">Package-specific ALTREP</text>

  <path d="M260 136 V160" class="arrow"/>
  <rect x="80" y="165" width="360" height="48" rx="2" class="box"/>
  <text x="260" y="195" text-anchor="middle" class="text">Consumer calls STRING_ELT</text>

  <path d="M260 221 V245" class="arrow"/>
  <rect x="80" y="250" width="360" height="48" rx="2" class="box"/>
  <text x="260" y="280" text-anchor="middle" class="text">Materialize R strings</text>

  <path d="M260 306 V330" class="arrow"/>
  <rect x="80" y="335" width="360" height="48" rx="2" class="box"/>
  <text x="260" y="365" text-anchor="middle" class="text">Base R string views</text>

  <rect x="600" y="80" width="360" height="48" rx="2" class="box"/>
  <text x="780" y="110" text-anchor="middle" class="text">Package-specific ALTREP</text>

  <path d="M780 136 V160" class="arrow"/>
  <rect x="600" y="165" width="360" height="48" rx="2" class="box"/>
  <text x="780" y="195" text-anchor="middle" class="text">Consumer uses charport::Reader</text>

  <path d="M780 221 V245" class="arrow"/>
  <rect x="600" y="250" width="360" height="48" rx="2" class="skip"/>
  <text x="780" y="280" text-anchor="middle" class="muted">materialization skipped</text>

  <path d="M780 306 V330" class="arrow"/>
  <rect x="600" y="335" width="360" height="48" rx="2" class="box"/>
  <text x="780" y="365" text-anchor="middle" class="text">String byte views</text>
  </g>
</svg>
