<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 444" role="img" aria-labelledby="title desc">
  <title id="title">ALTREP string access</title>
  <desc id="desc">A two-column flowchart comparing Base R access, which materializes strings before creating string views, with charport access, which skips materialization and reads string byte views.</desc>
  <!--
    Theme-safe palette (derived from the hex logo). Transparent background:
    every label rides on a white or lavender fill so it reads on light and
    dark pages alike. Connective strokes use a mid purple with ~4.4:1
    contrast against both white and near-black.
      ink   #2c1f57  text on light fills
      deep  #3a2a78  header text / strong accent
      edge  #6a4fa6  node borders
      line  #8670bf  arrows and divider
      skip  #9a86c8  dashed "skipped" node
      wash  #efe9fa / #e2d8f4  lavender header gradient
      tint  #f7f4fd  faint charport-column node fill
  -->
  <defs>
    <style>
      .head   { fill: #2c1f57; font: 700 20px Inter, Avenir, Helvetica, Arial, sans-serif; }
      .text   { fill: #2c1f57; font: 600 17px Inter, Avenir, Helvetica, Arial, sans-serif; }
      .muted  { fill: #6d5fa0; font: 600 15px Inter, Avenir, Helvetica, Arial, sans-serif; }
      .node   { fill: #ffffff; stroke: #6a4fa6; stroke-width: 1.6; }
      .node-c { fill: #f7f4fd; stroke: #6a4fa6; stroke-width: 1.6; }
      .skip   { fill: #ffffff; stroke: #9a86c8; stroke-width: 1.6; stroke-dasharray: 5 6; }
      .chip   { stroke: #b9a9df; stroke-width: 1.2; }
      .divider{ stroke: #8670bf; stroke-width: 1.3; stroke-dasharray: 2 7; stroke-linecap: round; }
      .arrow  { fill: none; stroke: #8670bf; stroke-width: 1.8; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
    <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe9fa"/>
      <stop offset="1" stop-color="#e2d8f4"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#8670bf"/>
    </marker>
  </defs>
  <rect x="46" y="12" width="948" height="424" rx="22" fill="#ffffff" stroke="#b9a9df" stroke-width="2.2"/>
  <g transform="translate(0,30)">

  <line x1="520" y1="58" x2="520" y2="360" class="divider"/>

  <rect x="184" y="12" width="152" height="38" rx="19" fill="url(#wash)" class="chip"/>
  <text x="260" y="37" text-anchor="middle" class="head">Base R</text>
  <rect x="704" y="12" width="152" height="38" rx="19" fill="url(#wash)" class="chip"/>
  <text x="780" y="37" text-anchor="middle" class="head">charport</text>

  <rect x="80" y="76" width="360" height="52" rx="10" class="node"/>
  <text x="260" y="108" text-anchor="middle" class="text">Package-specific ALTREP</text>
  <path d="M260 134 V156" class="arrow"/>
  <rect x="80" y="160" width="360" height="52" rx="10" class="node"/>
  <text x="260" y="192" text-anchor="middle" class="text">Consumer calls STRING_ELT</text>
  <path d="M260 218 V240" class="arrow"/>
  <rect x="80" y="244" width="360" height="52" rx="10" class="node"/>
  <text x="260" y="276" text-anchor="middle" class="text">Materialize R strings</text>
  <path d="M260 302 V324" class="arrow"/>
  <rect x="80" y="328" width="360" height="52" rx="10" class="node"/>
  <text x="260" y="360" text-anchor="middle" class="text">Base R string views</text>

  <rect x="600" y="76" width="360" height="52" rx="10" class="node-c"/>
  <text x="780" y="108" text-anchor="middle" class="text">Package-specific ALTREP</text>
  <path d="M780 134 V156" class="arrow"/>
  <rect x="600" y="160" width="360" height="52" rx="10" class="node-c"/>
  <text x="780" y="192" text-anchor="middle" class="text">Consumer uses charport::Reader</text>
  <path d="M780 218 V240" class="arrow"/>
  <rect x="600" y="244" width="360" height="52" rx="10" class="skip"/>
  <text x="780" y="276" text-anchor="middle" class="muted">materialization skipped</text>
  <path d="M780 302 V324" class="arrow"/>
  <rect x="600" y="328" width="360" height="52" rx="10" class="node-c"/>
  <text x="780" y="360" text-anchor="middle" class="text">String byte views</text>
  </g>
</svg>
